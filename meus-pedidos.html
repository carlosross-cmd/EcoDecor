<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Acompanhe seus pedidos realizados na EcoDecor."
    >

    <title>Meus pedidos | EcoDecor</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- ============================================
         CABEÇALHO
    ============================================ -->

    <header class="site-header">

        <div class="container header-inner">

            <a class="brand" href="index.html">

                <span class="brand-mark">⌁</span>

                <span>
                    <strong>
                        Eco<span>Decor</span>
                    </strong>

                    <small>
                        Decoração sustentável
                    </small>
                </span>

            </a>

            <!-- Navegação principal -->

            <nav class="main-nav">

                <a href="index.html">
                    Início
                </a>

                <a href="produtos.html">
                    Produtos
                </a>

                <a
                    class="active"
                    href="meus-pedidos.html"
                >
                    Meus pedidos
                </a>

            </nav>

        </div>

    </header>


    <!-- ============================================
         CONTEÚDO PRINCIPAL
    ============================================ -->

    <main>

        <!-- Título da página -->

        <section class="page-heading compact-heading">

            <div class="container">

                <p class="eyebrow">
                    ACOMPANHAMENTO
                </p>

                <h1>
                    Meus pedidos
                </h1>

                <p>
                    Acompanhe os pedidos registrados neste navegador.
                </p>

            </div>

        </section>


        <!-- Lista de pedidos -->

        <section class="section">

            <div class="container">

                <div
                    class="orders-card"
                    id="ordersList"
                >
                    <!--
                        Os pedidos serão carregados
                        dinamicamente pelo orders.js.
                    -->
                </div>

            </div>

        </section>

    </main>


    <!-- ============================================
         SCRIPTS
    ============================================ -->

    <!-- Dados dos produtos -->

    <script src="js/data.js"></script>

    <!-- Funções gerais do site -->

    <script src="js/app.js"></script>

    <!-- Biblioteca do Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuração do Supabase -->

    <script src="js/supabase-config.js"></script>

    <!-- Script específico da página -->

    <script src="js/orders.js"></script>

</body>

</html>
