<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Painel Admin | EcoDecor</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
    <section id="loginView" class="ad-login">
        <form id="loginForm" class="ad-card">
            <h1>EcoDecor <span>Admin</span></h1>
            <p>Entre com o e-mail do administrador.</p>
            <label>E-mail<input type="email" id="loginEmail" required autocomplete="username"></label>
            <label>Senha<input type="password" id="loginPassword" required autocomplete="current-password"></label>
            <p class="ad-error" id="loginError" hidden></p>
            <button class="button button-primary" type="submit">Entrar</button>
            <a class="ad-back" href="index.html">← Voltar para a loja</a>
        </form>
    </section>

    <div id="appView" hidden>
        <header class="ad-header">
            <strong>EcoDecor <span>Admin</span></strong>
            <nav class="ad-tabs">
                <button class="active" data-tab="produtos">Produtos</button>
                <button data-tab="pedidos">Pedidos</button>
            </nav>
            <div class="ad-user"><small id="userEmail"></small><a href="index.html">Ver loja</a><button id="logoutBtn" type="button">Sair</button></div>
        </header>

        <main class="ad-main">
            <p class="ad-notice" id="notice" hidden></p>

            <section id="tab-produtos">
                <div class="ad-toolbar">
                    <h2>Produtos <small id="productCount"></small></h2>
                    <input type="search" id="productSearch" placeholder="Buscar produto...">
                    <button class="button button-primary" id="newProductBtn" type="button">+ Novo produto</button>
                </div>
                <div class="ad-table-wrap"><table class="ad-table"><thead><tr><th></th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody id="productRows"></tbody></table></div>
            </section>

            <section id="tab-pedidos" hidden>
                <div class="ad-toolbar"><h2>Pedidos <small id="orderCount"></small></h2><button class="button button-secondary" id="reloadOrders" type="button">Atualizar</button></div>
                <div class="ad-table-wrap"><table class="ad-table"><thead><tr><th>Código</th><th>Cliente</th><th>Data</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody id="orderRows"></tbody></table></div>
            </section>
        </main>
    </div>

    <dialog id="productDialog" class="ad-dialog">
        <form id="productForm">
            <h3 id="productDialogTitle">Novo produto</h3>
            <div class="ad-grid">
                <label>Nome *<input name="nome" required></label>
                <label>Categoria *<input name="categoria" list="categoryList" required></label>
                <label>Preço (R$) *<input name="preco" type="number" step="0.01" min="0" required></label>
                <label>Foto principal * (caminho ou URL)<input name="imagem" placeholder="imagens/produto.jpg" required></label>
                <label class="full">Descrição curta *<textarea name="descricao" rows="2" required></textarea></label>
                <label>Material<input name="material"></label>
                <label>Dimensões<input name="dimensoes"></label>
                <label>Peso<input name="peso"></label>
                <label>Origem<input name="origem"></label>
                <label class="full">Sobre o produto<textarea name="sobre" rows="3"></textarea></label>
                <label class="full">Sustentabilidade<textarea name="eco" rows="2"></textarea></label>
                <label class="full">Fotos extras da galeria (uma por linha)<textarea name="imagens" rows="3"></textarea></label>
                <label class="ad-check full"><input name="ativo" type="checkbox" checked> Produto ativo (visível na loja)</label>
            </div>
            <datalist id="categoryList"></datalist>
            <p class="ad-error" id="productError" hidden></p>
            <div class="ad-dialog-actions"><button type="button" class="button button-secondary" id="cancelProduct">Cancelar</button><button type="submit" class="button button-primary">Salvar</button></div>
        </form>
    </dialog>

    <dialog id="orderDialog" class="ad-dialog"><div id="orderDetail"></div><div class="ad-dialog-actions"><button type="button" class="button button-secondary" id="closeOrder">Fechar</button></div></dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
