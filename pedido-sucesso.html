<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Confirmação de pedido registrado na EcoDecor."
    >

    <title>Pedido registrado | EcoDecor</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="success-page">

        <div class="success-card">

           

            <div
                class="success-icon"
                aria-hidden="true"
            >
                ✓
            </div>

             <p class="eyebrow">
                REGISTRO CONCLUÍDO
            </p>

            <h1>
                Pedido recebido com sucesso!
            </h1>

            <p>
                Seu pedido foi registrado nesta versão acadêmica.
                A confirmação real de pagamento ainda depende
                de uma integração com um provedor de pagamentos.
            </p>

            <div class="success-actions">

                <a
                    class="button button-primary"
                    href="meus-pedidos.html"
                >
                    Ver meus pedidos
                </a>

                <a
                    class="text-link"
                    href="produtos.html"
                >
                    Voltar para a loja →
                </a>

            </div>

        </div>

    </main>

</body>

</html>
